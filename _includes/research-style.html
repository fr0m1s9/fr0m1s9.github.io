<style>
.research-intro{color:var(--text-muted-color,#a5a8b3);font-size:1rem;line-height:1.8;margin:0 0 1.75rem}
.research-kicker{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--link-color,#569af6);margin:0 0 .65rem}
.research-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin:1.5rem 0 2rem}
.research-card{display:block;min-width:0;padding:1.5rem;border:1px solid var(--main-border-color,#343740);border-radius:14px;background:var(--card-bg,#25262b);text-decoration:none!important;color:var(--text-color,#ddd)!important;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.research-card:hover{transform:translateY(-3px);border-color:var(--link-color,#569af6);box-shadow:0 10px 26px rgba(0,0,0,.12)}
.research-card .research-icon{font-size:1.4rem;color:var(--link-color,#569af6);margin-bottom:1.2rem;display:block}
.research-card h2,.research-card h3{font-size:1.25rem;margin:.2rem 0 .5rem!important;color:inherit!important}
.research-card p{font-size:.9rem;line-height:1.65;margin:0 0 1.25rem;color:var(--text-muted-color,#a5a8b3)}
.research-card .research-arrow{font-size:.85rem;font-weight:600;color:var(--link-color,#569af6)}
.research-crumb{font-size:.84rem;color:var(--text-muted-color,#a5a8b3);margin:0 0 1.25rem}
.research-crumb a{color:var(--link-color,#569af6);text-decoration:none}
.research-section-title{font-size:1.2rem;margin:1.9rem 0 1rem}
.research-entry{display:block;padding:1.1rem 1.25rem;border:1px solid var(--main-border-color,#343740);border-radius:12px;margin-bottom:.8rem;text-decoration:none!important;background:var(--card-bg,#25262b)}
.research-entry strong{display:block;color:var(--heading-color,var(--text-color,#ddd));font-size:1rem}
.research-entry small{color:var(--text-muted-color,#a5a8b3);display:block;margin-top:.4rem}
.research-empty{border:1px dashed var(--main-border-color,#444);border-radius:12px;padding:2rem;text-align:center;color:var(--text-muted-color,#a5a8b3)}
@media(max-width:650px){.research-grid{grid-template-columns:1fr}.research-card{padding:1.25rem}}
</style>
